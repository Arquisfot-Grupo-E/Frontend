services:
  frontend:
    build: .
    container_name: bookworm_frontend
    expose:
      - "5173"  # Solo exponer dentro de Docker, no al host (Nginx será el punto de entrada)
    environment:
      # Nginx manejará el routing, pero mantenemos esto por si se accede directamente
      - VITE_GRAPHQL_URL=https://localhost/graphql
    networks:
      - dmz_network  # Solo en zona pública (DMZ)

  # Incluir el gateway para desarrollo individual (opcional)
  # NOTA: Si usas el docker-compose.full.yml, no necesitas este servicio
  gateway-1:
    profiles:
      - gateway  # Solo se levanta si usas: docker-compose --profile gateway up
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway_1
    expose:
      - "4000"  # Solo exponer dentro de Docker (Nginx hará el proxy)
    environment:
      # URLs de ejemplo - ajustar según tus microservicios
      USERS_SERVICE_URL: http://back-users:8001
      REVIEWS_SERVICE_URL: http://back-reviews:8000
      RECOMMENDATIONS_SERVICE_URL: http://back-recommendations:8002
      SCRAPING_SERVICE_URL: http://back-scraping:8080
    networks:
      - dmz_network      # Interfaz pública: recibe de Nginx
      - backend_network  # Interfaz privada: comunica con microservicios

  gateway-2:
    profiles:
      - gateway  # Solo se levanta si usas: docker-compose --profile gateway up
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway_2
    expose:
      - "4000"  # Solo exponer dentro de Docker (Nginx hará el proxy)
    environment:
      # URLs de ejemplo - ajustar según tus microservicios
      USERS_SERVICE_URL: http://back-users:8001
      REVIEWS_SERVICE_URL: http://back-reviews:8000
      RECOMMENDATIONS_SERVICE_URL: http://back-recommendations:8002
      SCRAPING_SERVICE_URL: http://back-scraping:8080
    networks:
      - dmz_network      # Interfaz pública: recibe de Nginx
      - backend_network  # Interfaz privada: comunica con microservicios
    
  gateway-3:
    profiles:
      - gateway  # Solo se levanta si usas: docker-compose --profile gateway up
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway_3
    expose:
      - "4000"  # Solo exponer dentro de Docker (Nginx hará el proxy)
    environment:
      # URLs de ejemplo - ajustar según tus microservicios
      USERS_SERVICE_URL: http://back-users:8001
      REVIEWS_SERVICE_URL: http://back-reviews:8000
      RECOMMENDATIONS_SERVICE_URL: http://back-recommendations:8002
      SCRAPING_SERVICE_URL: http://back-scraping:8080
    networks:
      - dmz_network      # Interfaz pública: recibe de Nginx
      - backend_network  # Interfaz privada: comunica con microservicios

  gateway-4:
    profiles:
      - gateway  # Solo se levanta si usas: docker-compose --profile gateway up
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway_4
    expose:
      - "4000"  # Solo exponer dentro de Docker (Nginx hará el proxy)
    environment:
      # URLs de ejemplo - ajustar según tus microservicios
      USERS_SERVICE_URL: http://back-users:8001
      REVIEWS_SERVICE_URL: http://back-reviews:8000
      RECOMMENDATIONS_SERVICE_URL: http://back-recommendations:8002
      SCRAPING_SERVICE_URL: http://back-scraping:8080
    networks:
      - dmz_network      # Interfaz pública: recibe de Nginx
      - backend_network  # Interfaz privada: comunica con microservicios

  # Nginx con HTTPS - Punto de entrada único
  nginx:
    image: nginx:latest
    container_name: bookworm_nginx
    ports:
      - "80:80"      # HTTP (redirige a HTTPS)
      - "443:443"    # HTTPS - Punto de entrada principal
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Montar certificados SSL
    depends_on:
      - frontend
    networks:
      - dmz_network  # Nginx solo necesita estar en DMZ para comunicarse con frontend y gateway

# =============================================================================
# REDES SEGMENTADAS
# =============================================================================
# Arquitectura de red:
#   - dmz_network (172.20.0.0/24): Zona pública
#     * Nginx: Proxy inverso y terminación SSL (puerto 443)
#     * Frontend: Aplicación React (puerto 5173)
#     * Gateway: Interfaz pública del GraphQL (puerto 4000)
#
# PREREQUISITO: Ejecutar bash scripts/setup-networks.sh (en Middleware-Graphql)
# =============================================================================
networks:
  dmz_network:
    external: true
    name: dmz_network
  
  backend_network:
    external: true
    name: backend_network