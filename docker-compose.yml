services:
  frontend:
    build: .
    container_name: bookworm_frontend
    ports:
      - "5173:5173"
    environment:
      # Apuntar al gateway usando el nombre del contenedor
      - VITE_GRAPHQL_URL=http://graphql_gateway:4000/graphql
    networks:
      - dmz_network  # Solo en zona pública (DMZ)
    # No automatic dependency to avoid recreate of gateway when using default compose
    #depends_on:
      #- gateway

  # Incluir el gateway para desarrollo individual (opcional)
  gateway:
    profiles:
      - gateway  # Solo se levanta si usas: docker-compose --profile gateway up
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway
    ports:
      - "4000:4000"
    networks:
      - dmz_network
      - backend_network

# =============================================================================
# REDES SEGMENTADAS
# =============================================================================
# Frontend:
#   - dmz_network: Zona pública (solo puede comunicarse con el gateway)
#
# Gateway (opcional, para desarrollo):
#   - dmz_network: Recibe del frontend
#   - backend_network: Comunica con backends
#
# PREREQUISITO: Ejecutar bash scripts/setup-networks.sh (en Middleware-Graphql)
# =============================================================================
networks:
  dmz_network:
    external: true
    name: dmz_network
  
  backend_network:
    external: true
    name: backend_network