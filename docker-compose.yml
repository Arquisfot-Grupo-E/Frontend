services:
  frontend:
    build: .
    container_name: bookworm_frontend
    ports:
      - "5173:80"
    environment:
      - VITE_GRAPHQL_URL=http://localhost:4000/graphql
    networks:
      - bookworm_network
    depends_on:
      - gateway

  # Incluir el gateway para asegurar dependencias
  gateway:
    image: bookworm/graphql-gateway
    container_name: graphql_gateway
    ports:
      - "4000:4000"
    networks:
      - bookworm_network

networks:
  bookworm_network:
    external: true
    name: bookworm_network