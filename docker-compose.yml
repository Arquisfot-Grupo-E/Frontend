services:
  frontend:
    build: .
    container_name: bookworm_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_GRAPHQL_URL=http://gateway:4000/graphql
    networks:
      - bookworm_network

  gateway:
    build:
      context: ../Middleware-Graphql
    container_name: graphql_gateway
    ports:
      - "4000:4000"
    networks:
      - bookworm_network

  # Nginx con HTTPS
  nginx:
    image: nginx:latest
    container_name: bookworm_nginx
    ports:
      - "80:80"      # HTTP (redirige a HTTPS)
      - "443:443"    # HTTPS
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Montar certificados SSL
    depends_on:
      - frontend
      - gateway
    networks:
      - bookworm_network

networks:
  bookworm_network:
    external: true
    name: bookworm_network