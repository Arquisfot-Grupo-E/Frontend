# ================================
# ModSecurity Configuration
# ================================
# Configuración principal de ModSecurity para BookWorm Frontend WAF

# -- Rule engine initialization ----------------------------------------------
# Enable ModSecurity, attaching it to every transaction.
SecRuleEngine On

# -- Request body handling ---------------------------------------------------
# Allow ModSecurity to access request bodies.
SecRequestBodyAccess On

# Maximum request body size we will accept for buffering (128KB by default)
SecRequestBodyLimit 13107200

# What to do if the request body size is above our configured limit.
SecRequestBodyLimitAction Reject

# Verify that we've correctly processed the request body.
SecRequestBodyNoFilesLimit 131072

# Store up to 128 KB of request body data in memory.
SecRequestBodyInMemoryLimit 131072

# -- Response body handling --------------------------------------------------
# Allow ModSecurity to access response bodies.
SecResponseBodyAccess On

# Which response MIME types do you want to inspect?
SecResponseBodyMimeType text/plain text/html text/xml application/json

# Buffer response bodies of up to 512 KB in length.
SecResponseBodyLimit 524288

# What happens when we encounter a response body larger than configured limit?
SecResponseBodyLimitAction ProcessPartial

# -- Filesystem configuration ------------------------------------------------
# The location where ModSecurity stores temporary files
SecTmpDir /tmp/

# The location where ModSecurity will keep its persistent data
SecDataDir /tmp/

# -- File uploads handling configuration -------------------------------------
# The location where ModSecurity stores intercepted uploaded files
SecUploadDir /tmp/

# By default, only keep the files that were determined to be unusual
SecUploadKeepFiles RelevantOnly

# Uploaded files are by default created with permissions that do not allow
# any other user to access them. You may need to relax that if you want to
# interface ModSecurity to an external program (e.g., an anti-virus).
SecUploadFileMode 0600

# -- Debug log configuration -------------------------------------------------
# The default debug log configuration is to duplicate the error and warning
# messages from the error log.
SecDebugLog /var/log/modsec/debug.log
SecDebugLogLevel 3

# -- Audit log configuration -------------------------------------------------
# Log the transactions that are marked by a rule, as well as those that
# trigger a server error (determined by a 5xx or 4xx, excluding 404, server response status codes).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"

# Log everything we know about a transaction.
SecAuditLogParts ABIJDEFHZ

# Use a single file for logging.
SecAuditLogType Serial
SecAuditLog /var/log/modsec/audit.log

# -- Miscellaneous -----------------------------------------------------------
# Use the most commonly used application/x-www-form-urlencoded parameter separator
SecArgumentSeparator &

# Settle on version 0 (zero) cookies, as that is what most applications use.
SecCookieFormat 0

# Specify your Unicode Code Point
SecUnicodeMapFile /etc/nginx/modsec/unicode.mapping

# -- Security rules configuration --------------------------------------------
# Include OWASP Core Rule Set
Include /etc/nginx/modsec/owasp-crs/crs-setup.conf
Include /etc/nginx/modsec/owasp-crs/rules/*.conf

# Include custom rules
Include /etc/nginx/modsec/custom-rules/*.conf

# ================================
# Custom Security Settings
# ================================

# Block suspicious user agents
SecRule REQUEST_HEADERS:User-Agent "@pmFromFile /etc/nginx/modsec/blacklist-user-agents.txt" \
    "id:1000,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Suspicious User Agent Detected'"

# Rate limiting by IP (max 100 requests per minute)
SecAction "id:1001,phase:1,nolog,pass,initcol:ip=%{REMOTE_ADDR},setvar:ip.requests_per_minute=+1,expirevar:ip.requests_per_minute=60"
SecRule IP:REQUESTS_PER_MINUTE "@gt 100" \
    "id:1002,\
    phase:1,\
    deny,\
    status:429,\
    log,\
    msg:'Rate limit exceeded: %{ip.requests_per_minute} requests/minute from %{REMOTE_ADDR}'"

# Block SQL injection attempts
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(?:union.*select|insert.*into|delete.*from|update.*set|drop.*table)" \
    "id:1003,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'SQL Injection Attempt Detected'"

# Block XSS attempts
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(?:<script|javascript:|onerror=|onload=)" \
    "id:1004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'XSS Attack Attempt Detected'"

# Block path traversal attempts
SecRule REQUEST_URI "@rx (?:\.\.\/|\.\.\\)" \
    "id:1005,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Path Traversal Attack Detected'"

# Block command injection attempts
SecRule ARGS|REQUEST_HEADERS "@rx (?i)(?:\||;|`|\$\(|<\(|>\()" \
    "id:1006,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Command Injection Attempt Detected'"

# Enforce HTTPS (if not behind reverse proxy)
SecRule REQUEST_SCHEME "!@streq https" \
    "id:1007,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveById=1007"

# Block requests with no Host header
SecRule &REQUEST_HEADERS:Host "@eq 0" \
    "id:1008,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    msg:'Request Missing Host Header'"

# GraphQL specific protections
SecRule REQUEST_URI "@streq /graphql" \
    "id:2000,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx (?i)(?:__schema|introspection)" \
        "id:2001,\
        t:none,\
        deny,\
        status:403,\
        log,\
        msg:'GraphQL Introspection Attempt Blocked'"

# Limit GraphQL query depth (prevent DoS)
SecRule REQUEST_URI "@streq /graphql" \
    "id:2002,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx \{[^\}]*\{[^\}]*\{[^\}]*\{[^\}]*\{[^\}]*\{[^\}]*\{[^\}]*\{" \
        "id:2003,\
        t:none,\
        deny,\
        status:400,\
        log,\
        msg:'GraphQL Query Too Deep - Possible DoS Attack'"

# Block known malicious IPs (example - create file with IPs)
