# ================================
# Anomaly Scoring Configuration
# ================================
# These are already set in crs-setup.conf but can be overridden here

# Inbound Anomaly Score Threshold
# SecAction "id:900110,phase:1,pass,nolog,setvar:tx.inbound_anomaly_score_threshold=5"

# Outbound Anomaly Score Threshold
# SecAction "id:900111,phase:1,pass,nolog,setvar:tx.outbound_anomaly_score_threshold=4"

# Paranoia Level (1-4, higher = more strict)
# SecAction "id:900000,phase:1,pass,nolog,setvar:tx.paranoia_level=2"
