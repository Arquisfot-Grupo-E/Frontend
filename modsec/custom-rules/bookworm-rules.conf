# ================================
# BookWorm Custom WAF Rules
# ================================
# Reglas personalizadas específicas para la aplicación BookWorm

# ================================
# Authentication & Session Rules
# ================================

# Detect JWT token in headers (should be present in authenticated requests)
SecRule REQUEST_HEADERS:Authorization "!@rx ^Bearer\s+[\w\-\.]+$" \
    "id:4001,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_URI "!@rx ^/(login|register|graphql)$" \
        "id:4002,\
        t:none,\
        log,\
        msg:'Request to protected endpoint without valid Bearer token'"

# Detect suspicious JWT patterns (too short or malformed)
SecRule REQUEST_HEADERS:Authorization "@rx ^Bearer\s+.{1,20}$" \
    "id:4003,\
    phase:1,\
    deny,\
    status:401,\
    log,\
    msg:'Suspicious JWT token - too short or malformed'"

# ================================
# GraphQL Specific Rules
# ================================

# Only allow POST to GraphQL endpoint
SecRule REQUEST_URI "@streq /graphql" \
    "id:4010,\
    phase:1,\
    deny,\
    status:405,\
    log,\
    msg:'Only POST method allowed for GraphQL',\
    chain"
    SecRule REQUEST_METHOD "!@streq POST" \
        "id:4011,t:none"

# Require Content-Type for GraphQL requests
SecRule REQUEST_URI "@streq /graphql" \
    "id:4012,\
    phase:1,\
    deny,\
    status:400,\
    log,\
    msg:'GraphQL request missing Content-Type header',\
    chain"
    SecRule &REQUEST_HEADERS:Content-Type "@eq 0" \
        "id:4013,t:none"

# Block GraphQL mutations without authentication (except login/register)
SecRule REQUEST_URI "@streq /graphql" \
    "id:4014,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx (?i)mutation.*(?!login|register)" \
        "id:4015,\
        t:none,\
        chain"
        SecRule &REQUEST_HEADERS:Authorization "@eq 0" \
            "id:4016,\
            t:none,\
            deny,\
            status:401,\
            log,\
            msg:'GraphQL mutation requires authentication'"

# Block dangerous GraphQL operations
SecRule REQUEST_URI "@streq /graphql" \
    "id:4017,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Dangerous GraphQL operation detected',\
    chain"
    SecRule REQUEST_BODY "@rx (?i)(?:__type|__typename|__schema|__inputvalue)" \
        "id:4018,t:none"

# Limit GraphQL query complexity (max 10 operations)
SecRule REQUEST_URI "@streq /graphql" \
    "id:4019,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    msg:'GraphQL batch query too large',\
    chain"
    SecRule REQUEST_BODY "@rx (?:\{[^\}]*){11,}" \
        "id:4020,t:none"

# ================================
# API Abuse Prevention
# ================================

# Rate limiting per IP for login attempts (max 5 per minute)
SecRule REQUEST_URI "@streq /graphql" \
    "id:4030,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx (?i)mutation.*login" \
        "id:4031,\
        t:none,\
        chain"
        SecAction "initcol:ip=%{REMOTE_ADDR},setvar:ip.login_attempts=+1,expirevar:ip.login_attempts=60"

SecRule IP:LOGIN_ATTEMPTS "@gt 5" \
    "id:4032,\
    phase:2,\
    deny,\
    status:429,\
    log,\
    msg:'Too many login attempts from %{REMOTE_ADDR}: %{ip.login_attempts}'"

# Rate limiting for registration (max 3 per hour)
SecRule REQUEST_URI "@streq /graphql" \
    "id:4033,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx (?i)mutation.*register" \
        "id:4034,\
        t:none,\
        chain"
        SecAction "initcol:ip=%{REMOTE_ADDR},setvar:ip.register_attempts=+1,expirevar:ip.register_attempts=3600"

SecRule IP:REGISTER_ATTEMPTS "@gt 3" \
    "id:4035,\
    phase:2,\
    deny,\
    status:429,\
    log,\
    msg:'Too many registration attempts from %{REMOTE_ADDR}: %{ip.register_attempts}'"

# ================================
# Content Validation Rules
# ================================

# Block excessively long review content (max 5000 chars)
SecRule REQUEST_URI "@streq /graphql" \
    "id:4040,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    msg:'Review content too long',\
    chain"
    SecRule REQUEST_BODY "@rx createReview.*content.*\".{5001,}\"" \
        "id:4041,t:none"

# Block HTML tags in review content
SecRule REQUEST_URI "@streq /graphql" \
    "id:4042,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    msg:'HTML tags not allowed in review content',\
    chain"
    SecRule REQUEST_BODY "@rx createReview.*content.*<[^>]+>" \
        "id:4043,t:none"

# Validate email format in registration
SecRule REQUEST_URI "@streq /graphql" \
    "id:4044,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    msg:'Invalid email format',\
    chain"
    SecRule REQUEST_BODY "@rx register.*email.*\"[^@]+@[^@]+\.[^@]+\"" \
        "id:4045,t:none,chain,skip:1"
    SecRule REQUEST_BODY "@rx register" \
        "id:4046,t:none"

# ================================
# File Upload Protection
# ================================

# Block executable file uploads (if avatar upload is implemented)
SecRule FILES "@rx (?i)\.(?:exe|bat|cmd|sh|php|asp|jsp|py|rb|pl)$" \
    "id:4050,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    msg:'Executable file upload blocked'"

# Limit file upload size (max 5MB for avatars)
SecRule FILES_SIZES "@gt 5242880" \
    "id:4051,\
    phase:2,\
    deny,\
    status:413,\
    log,\
    msg:'File upload too large (max 5MB)'"

# ================================
# Anti-Automation Rules
# ================================

# Detect headless browsers (common in bots)
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(?:headless|phantom|selenium|puppeteer)" \
    "id:4060,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Headless browser detected'"

# Block requests without Accept header (likely bots)
SecRule &REQUEST_HEADERS:Accept "@eq 0" \
    "id:4061,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    msg:'Request missing Accept header (likely bot)'"

# Block requests with suspicious Accept-Language patterns
SecRule &REQUEST_HEADERS:Accept-Language "@eq 0" \
    "id:4062,\
    phase:1,\
    pass,\
    log,\
    msg:'Request missing Accept-Language header (possible bot)'"

# ================================
# Data Exfiltration Prevention
# ================================

# Block attempts to export large amounts of data
SecRule REQUEST_URI "@streq /graphql" \
    "id:4070,\
    phase:2,\
    deny,\
    status:400,\
    log,\
    msg:'Attempting to query too many items',\
    chain"
    SecRule REQUEST_BODY "@rx (?i)(?:first|limit|take):\s*(?:[1-9]\d{3,})" \
        "id:4071,t:none"

# ================================
# Security Headers Validation
# ================================

# Require Origin header for POST requests to prevent CSRF
SecRule REQUEST_METHOD "@streq POST" \
    "id:4080,\
    phase:1,\
    pass,\
    nolog,\
    chain"
    SecRule &REQUEST_HEADERS:Origin "@eq 0" \
        "id:4081,\
        t:none,\
        log,\
        msg:'POST request missing Origin header',\
        setvar:tx.anomaly_score=+3"

# Validate Referer header for state-changing operations
SecRule REQUEST_URI "@streq /graphql" \
    "id:4082,\
    phase:2,\
    pass,\
    nolog,\
    chain"
    SecRule REQUEST_BODY "@rx (?i)mutation" \
        "id:4083,\
        t:none,\
        chain"
        SecRule REQUEST_HEADERS:Referer "!@rx ^https?://(?:localhost|127\.0\.0\.1|bookworm_frontend)" \
            "id:4084,\
            t:none,\
            log,\
            msg:'Suspicious referer for mutation',\
            setvar:tx.anomaly_score=+2"
