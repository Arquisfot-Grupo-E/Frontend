# ================================
# Nginx with ModSecurity WAF Configuration
# ================================
# Configuración de Nginx con ModSecurity para BookWorm Frontend

# Cargar el módulo de ModSecurity
load_module modules/ngx_http_modsecurity_module.so;

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ================================
  # Logging Configuration
  # ================================
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  log_format waf_log '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" WAF_SCORE:$modsec_anomaly_score';

  access_log /var/log/nginx/access.log main;
  access_log /var/log/nginx/waf.log waf_log;

  # ================================
  # Performance Optimizations
  # ================================
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 20M;
  client_body_buffer_size 128k;

  # Gzip Compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml font/truetype font/opentype
             application/vnd.ms-fontobject image/svg+xml;

  # ================================
  # Security Headers (Global)
  # ================================
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # ================================
  # Rate Limiting Zones
  # ================================
  limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  # ================================
  # Upstream Definitions
  # ================================
  upstream frontend {
    server bookworm_frontend:5173;
    keepalive 32;
  }

  upstream gateway {
    server graphql_gateway:4000;
    keepalive 32;
  }

  # ================================
  # HTTP Server (Redirect to HTTPS)
  # ================================
  server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }

    # Health check endpoint (no redirect)
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }
  }

  # ================================
  # HTTPS Server with WAF
  # ================================
  server {
    listen 443 ssl http2;
    server_name localhost;

    # ================================
    # SSL Configuration
    # ================================
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ================================
    # Security Headers (HTTPS)
    # ================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://localhost" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ================================
    # ModSecurity WAF Configuration
    # ================================
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/modsecurity.conf;

    # ================================
    # Connection Limiting
    # ================================
    limit_conn addr 10;

    # ================================
    # Root Location (Frontend)
    # ================================
    location / {
      # Rate limiting
      limit_req zone=general burst=20 nodelay;

      # ModSecurity is enabled globally but can be controlled per location
      modsecurity on;

      # Proxy to frontend
      proxy_pass http://frontend;
      proxy_http_version 1.1;

      # Headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # WebSocket support
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Timeouts
      proxy_connect_timeout 60s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;

      # Buffering
      proxy_buffering on;
      proxy_buffer_size 4k;
      proxy_buffers 8 4k;
      proxy_busy_buffers_size 8k;

      # Don't cache
      proxy_cache_bypass $http_upgrade;
    }

    # ================================
    # GraphQL Gateway
    # ================================
    location /graphql {
      # Stricter rate limiting for API
      limit_req zone=api burst=50 nodelay;

      # Enhanced WAF for GraphQL
      modsecurity on;

      # Only allow POST and OPTIONS
      if ($request_method !~ ^(POST|OPTIONS)$) {
        return 405;
      }

      # CORS headers (adjust origins as needed)
      add_header Access-Control-Allow-Origin "https://localhost" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
      add_header Access-Control-Allow-Credentials "true" always;
      add_header Access-Control-Max-Age "3600" always;

      # Handle preflight requests
      if ($request_method = 'OPTIONS') {
        return 204;
      }

      # Proxy to gateway
      proxy_pass http://gateway;
      proxy_http_version 1.1;

      # Headers
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      # WebSocket support for GraphQL subscriptions
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # Timeouts (longer for GraphQL queries)
      proxy_connect_timeout 90s;
      proxy_send_timeout 90s;
      proxy_read_timeout 90s;

      # Buffering
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # ================================
    # Health Check Endpoint
    # ================================
    location /health {
      access_log off;
      modsecurity off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # ================================
    # WAF Status Endpoint (Internal Only)
    # ================================
    location /waf-status {
      access_log off;
      allow 127.0.0.1;
      allow 172.20.0.0/24;  # DMZ network
      deny all;

      modsecurity off;

      default_type application/json;
      return 200 '{"waf":"enabled","status":"active","version":"modsecurity-3.0"}';
    }

    # ================================
    # Nginx Status (Internal Only)
    # ================================
    location /nginx_status {
      access_log off;
      allow 127.0.0.1;
      allow 172.20.0.0/24;  # DMZ network
      deny all;

      modsecurity off;
      stub_status on;
    }

    # ================================
    # Block Common Attack Paths
    # ================================
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    location ~ ^/(admin|phpmyadmin|wp-admin|wp-login\.php) {
      deny all;
      access_log off;
      log_not_found off;
      return 444;
    }

    # ================================
    # Static Files Optimization
    # ================================
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;

      modsecurity off;  # No need for WAF on static assets

      proxy_pass http://frontend;
      proxy_set_header Host $host;
    }

    # ================================
    # Error Pages
    # ================================
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
