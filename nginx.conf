worker_processes auto;

events {
worker_connections 10240;
multi_accept on;
}

http {
# ============================================
# THROTTLING CONFIGURATION
# ============================================

```
# Limite por IP
limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=100r/s;

limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

limit_req_log_level warn;
limit_req_status 429;

# ============================================
# UPSTREAM CONFIGURATION
# ============================================

upstream frontend {
    server bookworm_frontend:5173 max_fails=2 fail_timeout=1s;
}

upstream gateway {
    least_conn;
    server graphql_gateway_1:4000 max_fails=2 fail_timeout=1s;
    server graphql_gateway_2:4000 max_fails=2 fail_timeout=1s;
    server graphql_gateway_3:4000 max_fails=2 fail_timeout=1s;
    server graphql_gateway_4:4000 max_fails=2 fail_timeout=1s;
    # listo para añadir service discovery dinámico
}

# ============================================
# REDIRECCIÓN HTTP -> HTTPS
# ============================================

server {
    listen 80;
    server_name localhost;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================
# SERVIDOR HTTPS
# ============================================

server {
    listen 443 ssl http2;
    server_name localhost;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ========================================
    # FRONTEND PROXY
    # ========================================
    location / {
        limit_req zone=frontend_limit burst=20 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    # ========================================
    # GATEWAY GRAPHQL PROXY
    # ========================================
    location /graphql {
        limit_req zone=graphql_limit burst=10 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 1s;   # detecta rápido fallos
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;

        add_header X-RateLimit-Limit "30" always;
        add_header X-RateLimit-Remaining $limit_req_status always;
    }
}
