worker_processes 1;

events {
  worker_connections 1024;
}

http {
  # ============================================
  # THROTTLING CONFIGURATION
  # ============================================

  # Zona de rate limiting por IP (10MB almacena ~160k IPs)
  # 30 req/s para API GraphQL
  limit_req_zone $binary_remote_addr zone=graphql_limit:10m rate=30r/s;

  # 10 req/s para endpoints de autenticación (más restrictivo)
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

  # 100 req/s para frontend (menos restrictivo)
  limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=100r/s;

  # Límite de conexiones concurrentes por IP
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # Configuración de logs para rate limiting
  limit_req_log_level warn;
  limit_req_status 429;

  # ============================================
  # UPSTREAM CONFIGURATION
  # ============================================

  upstream frontend {
    server bookworm_frontend:5173;
  }

  upstream gateway {
    ip_hash;
    server graphql_gateway_1:4000;
    server graphql_gateway_2:4000;
    server graphql_gateway_3:4000;
    server graphql_gateway_4:4000;
  }

  # Redirigir HTTP a HTTPS
  server {
    listen 80;
    server_name localhost;
    
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # Servidor HTTPS
  server {
    listen 443 ssl;
    server_name localhost;

    # Certificados SSL
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    # Configuración SSL moderna y segura
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy al frontend
    location / {
      # Rate limiting: 100 req/s con burst de 20 (permite picos)
      limit_req zone=frontend_limit burst=20 nodelay;

      # Límite de 50 conexiones concurrentes por IP
      limit_conn conn_limit 50;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;
    }

    # Proxy al gateway GraphQL
    location /graphql {
      # Rate limiting: 30 req/s con burst de 10
      limit_req zone=graphql_limit burst=10 nodelay;

      # Límite de 20 conexiones concurrentes por IP
      limit_conn conn_limit 20;

      # Timeout más largo para queries complejas
      proxy_read_timeout 60s;
      proxy_connect_timeout 10s;
      proxy_send_timeout 10s;

      proxy_pass http://gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_cache_bypass $http_upgrade;

      # Headers adicionales para debugging de rate limiting
      add_header X-RateLimit-Limit "30" always;
      add_header X-RateLimit-Remaining $limit_req_status always;
    }
  }
}