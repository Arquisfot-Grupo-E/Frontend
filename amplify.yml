version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install  # Cambia de 'npm ci' a 'npm install'
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/client  # Ajusta según tu configuración
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
